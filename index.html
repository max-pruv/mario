<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>IAM Kart — Inès · Alice · Marlon</title>
<meta name="description" content="IAM Kart : un jeu de kart 3D avec vaisseaux lumineux, jouable dans le navigateur et installable sur mobile.">
<meta name="theme-color" content="#120a24">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="IAM Kart">
<link rel="stylesheet" href="./style.css">
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="game"></canvas>
    <canvas id="hud"></canvas>
  </div>

  <!-- Touch controls -->
  <div id="controls">
    <div class="pad left">
      <div id="stick" aria-label="Joystick de direction"><div id="knob"></div></div>
    </div>
    <div class="pad right">
      <button class="btn item" id="btnB" aria-label="Objet">B</button>
      <button class="btn gas"  id="btnA" aria-label="Accélérer">A</button>
    </div>
  </div>
  <button id="btnGyro" aria-label="Activer le gyroscope">🧭 GYRO&nbsp;: OFF</button>
  <button id="btnAudio" aria-label="Couper ou activer le son">🔊</button>

  <!-- Blocking update screen: get the new version before playing -->
  <div id="update-overlay" hidden>
    <div id="update-panel">
      <div class="spin">🔄</div>
      <p>Mise à jour du jeu…</p>
      <small>Quelques secondes, la nouvelle version arrive !</small>
    </div>
  </div>

  <!-- Post-race name entry for the local leaderboard -->
  <div id="name-overlay" hidden>
    <div id="name-panel">
      <h3>🏁 Ton prénom pour le classement</h3>
      <div id="name-chips"></div>
      <input id="name-input" maxlength="12" autocomplete="off" placeholder="Tape ton prénom…">
      <div id="name-actions">
        <button id="name-skip">Passer</button>
        <button id="name-save">SAUVER ✔</button>
      </div>
    </div>
  </div>

  <!-- Install banner (shown only outside the installed app) -->
  <div id="install-banner" hidden>
    <span id="install-text"></span>
    <button id="install-do" hidden>Installer</button>
    <button id="install-close" aria-label="Fermer">✕</button>
  </div>

  <!-- Landscape-only: shown in portrait on touch devices, the game pauses -->
  <div id="rotate-hint">
    <div>📱↺</div>
    <p>Tourne ton téléphone en mode paysage&nbsp;!</p>
    <small>🔒 Astuce&nbsp;: active le verrou de rotation iOS (Centre de contrôle)<br>une fois en paysage, pour jouer au gyroscope sans que l’écran bascule.</small>
  </div>

</div>

<script type="module" src="./game.js"></script>
<script>
  // Auto-update: the service worker precaches everything for offline play,
  // and we aggressively look for new releases — on every launch, whenever the
  // app regains focus (e.g. reopened from the home screen), and every 3
  // minutes while playing. When a new version is ready, game.js applies it at
  // the next safe moment (menu or end of race) by reloading.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      const updOverlay = document.getElementById('update-overlay');
      const canBlock = () => {
        const st = window.IAM ? window.IAM.state : 'title';
        return st !== 'race' && st !== 'countdown';
      };
      const showUpdating = () => {
        if (!canBlock() || !navigator.serviceWorker.controller) return;
        window.__iamUpdating = true;
        updOverlay.hidden = false;
        // safety: never block more than 20s if the install stalls
        setTimeout(() => {
          if (window.__iamUpdating) { window.__iamUpdating = false; updOverlay.hidden = true; }
        }, 20000);
      };
      navigator.serviceWorker.register('./sw.js').then((reg) => {
        const check = () => reg.update().catch(() => {});
        check();
        setInterval(check, 3 * 60 * 1000);
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) check();
        });
        window.addEventListener('focus', check);
        if (reg.waiting) showUpdating(); // update already downloaded
        reg.addEventListener('updatefound', showUpdating);
      }).catch(() => {});

      navigator.serviceWorker.addEventListener('controllerchange', () => {
        // First install: a controller appears where there was none — no reload needed.
        if (!window.__iamHadController) { window.__iamHadController = true; return; }
        if (window.__iamUpdating) { location.reload(); return; } // loading screen -> reload now
        window.__iamUpdateReady = true; // mid-race: game.js reloads when it's safe
      });
      window.__iamHadController = !!navigator.serviceWorker.controller;
    });
  }

  // ---- Install banner ----
  // iOS: Apple forbids programmatic install, so we guide the 2 taps.
  // Android/Chrome: real one-click install via beforeinstallprompt.
  (function () {
    const banner = document.getElementById('install-banner');
    const textEl = document.getElementById('install-text');
    const doBtn = document.getElementById('install-do');
    const closeBtn = document.getElementById('install-close');
    const KEY = 'iam-install-dismissed';
    const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    if (standalone) return;
    try {
      const d = +localStorage.getItem(KEY) || 0;
      if (Date.now() - d < 7 * 86400 * 1000) return; // dismissed recently
    } catch (e) {}

    const shareSvg = '<svg width="15" height="18" viewBox="0 0 15 18" style="vertical-align:-3px" fill="none" stroke="#4aa3ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 1v10.5M4 4.5 7.5 1 11 4.5"/><path d="M3 8H2v9h11V8h-1"/></svg>';
    const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
      (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

    let deferred = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferred = e;
      textEl.textContent = '📲 Joue en plein écran, même hors ligne !';
      doBtn.hidden = false;
      banner.hidden = false;
    });
    doBtn.addEventListener('click', async () => {
      if (!deferred) return;
      deferred.prompt();
      await deferred.userChoice.catch(() => {});
      deferred = null;
      banner.hidden = true;
    });

    if (isIOS) {
      setTimeout(() => {
        textEl.innerHTML = '📲 Installe <b>IAM Kart</b>&nbsp;: appuie sur ' + shareSvg +
          ' puis «&nbsp;Sur l’écran d’accueil&nbsp;»';
        banner.hidden = false;
      }, 2500);
    }

    closeBtn.addEventListener('click', () => {
      banner.hidden = true;
      try { localStorage.setItem(KEY, String(Date.now())); } catch (e) {}
    });
  })();
</script>
</body>
</html>
